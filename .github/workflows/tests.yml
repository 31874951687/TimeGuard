name: tests

# 只跑不依赖"真实桌面"的那几套：单元测试 + 环境自检。
# tools/ 下的 e2e 脚本需要真实显示器、托盘、置顶弹窗，不适合在 CI 里跑。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 单元测试（22 时长 + 32 待办 + 48 周期规则 + 38 调度器）
        env:
          # 让测试用临时目录，别碰真实数据；顺便验证这一条也生效
          TIMEGUARD_NO_TOAST: '1'
        run: |
          python tests/test_core.py
          python tests/test_tasks.py
          python tests/test_recurrence.py
          python tests/test_scheduler.py

      - name: 环境自检
        env:
          TIMEGUARD_NO_TOAST: '1'
        run: python -m timeguard --selftest

      - name: 代码风格（pyflakes 级别：未定义名 / 未用导入）
        run: |
          pip install ruff
          ruff check --select F,E9 timeguard tests tools
