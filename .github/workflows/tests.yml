name: tests

# 只跑不依赖"真实桌面"的那几套：单元测试 + 环境自检。
# tools/ 下的 e2e 脚本需要真实显示器、托盘、置顶弹窗，不适合在 CI 里跑。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 单元测试（全部套件：时长 / 待办 / 周期规则 / 调度器 / 累计打卡）
        env:
          # 让测试用临时目录，别碰真实数据；顺便验证这一条也生效
          TIMEGUARD_NO_TOAST: '1'
          # runner 是 en-US：stdout 走管道时默认 cp1252，中文输出会抛 UnicodeEncodeError
          # （第一次跑 CI 就是这么红的）。测试脚本自己也会调 use_utf8_console()，这里再加一道保险。
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_core.py
          python tests/test_tasks.py
          python tests/test_recurrence.py
          python tests/test_scheduler.py
          python tests/test_cumulative.py

      - name: 环境自检
        env:
          TIMEGUARD_NO_TOAST: '1'
          PYTHONIOENCODING: utf-8
        run: python -m timeguard --selftest

      - name: 代码风格（pyflakes 级别：未定义名 / 未用导入）
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install ruff
          ruff check --select F,E9 timeguard tests tools
